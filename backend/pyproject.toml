[project]
name = "bank-news-ai"
version = "0.1.0"
description = "AI-powered banking news aggregation and summarization"
readme = "README.md"
authors = [
    { email = "singh.aditya90@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic>=2.0",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "lxml",
    "loguru",
    "langchain",
    "langchain-community",
    "langchain-core",
    "ollama",
    "apscheduler",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]